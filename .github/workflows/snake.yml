name: Generate Snake

on:
  schedule:
    - cron: "0 */6 * * *"     # refresh every 6 hours
  workflow_dispatch:           # run it manually anytime
  push:
    branches:
      - main                   # change to master if that's your branch

concurrency:
  group: snake
  cancel-in-progress: true     # never run two at once

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Generate snakes from contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
            dist/snake-matrix.svg?palette=github-dark&color_snake=#00ff41&color_dots=#0d1117,#003b00,#008f11,#00c62b,#00ff41
            dist/snake-blueteam.svg?palette=github-dark&color_snake=#00e5ff&color_dots=#0d1117,#0a3d62,#1565c0,#1e88e5,#64b5f6
            dist/snake-redalert.svg?palette=github-dark&color_snake=#ff1744&color_dots=#161b22,#4a0d0d,#8b1a1a,#d32f2f,#ff5252
            dist/snake-neon.gif?palette=github-dark&color_snake=#ff00ff&color_dots=#161b22,#3d0066,#7a00cc,#b300ff,#e066ff

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
